name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        # --force-jit: some transitive deps use build hooks, which the AOT
        # build-script compile does not support.
        run: dart run build_runner build --delete-conflicting-outputs --force-jit

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build dev APK
        run: flutter build apk --flavor dev --debug
