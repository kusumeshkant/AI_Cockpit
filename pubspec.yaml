name: cockpit
description: "Cockpit — the mobile control panel for AI agents. Review, edit and approve what your agents propose."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

# TODO(deps): pin every `any` constraint to a caret version once the first
# green CI build locks a working set (copy resolved versions from pubspec.lock).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State, DI, routing
  flutter_riverpod: any
  riverpod_annotation: any
  go_router: any
  get_it: any
  injectable: any

  # Models & errors
  freezed_annotation: any
  json_annotation: ^4.9.0 # json_serializable rejects constraints allowing < 4.9.0
  dartz: any

  # Network & i18n
  dio: any
  intl: any

  # Persistence
  shared_preferences: any
  flutter_secure_storage: any

  # Backend & push
  supabase_flutter: any
  firebase_core: any
  firebase_messaging: any
  flutter_local_notifications: any

  # Observability
  sentry_flutter: ^9.30.0 # 8.x targets Kotlin language 1.6, which current Android toolchains reject
  posthog_flutter: any
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  http: ^1.6.0
  marionette_flutter: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: any
  injectable_generator: any
  freezed: any
  json_serializable: any
  riverpod_generator: any
  flutter_lints: any
  mocktail: any
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/

# Launcher icons: `dart run flutter_launcher_icons` (ADR-010).
# Android keeps the `ic_launcher` name, so the manifest is unchanged.
# No web/windows/macos targets in this project yet.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0E1F"
  adaptive_icon_foreground: "assets/branding/ic_launcher_foreground.png"
  adaptive_icon_monochrome: "assets/branding/ic_launcher_monochrome.png"
  remove_alpha_ios: true
  # The pack's foreground already sits inside the 66/108 safe zone.
  adaptive_icon_foreground_inset: 0

# Native splash: `dart run flutter_native_splash:create` (ADR-010).
flutter_native_splash:
  color: "#0A0E1F"
  image: assets/branding/logo_symbol_splash.png
  android_12:
    color: "#0A0E1F"
    image: assets/branding/splash-android12-padded-1152.png
